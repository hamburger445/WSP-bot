services:
  wsp-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /var/lib/wsp/data/wsp.db
    ports:
      - "8080:8080"
    volumes:
      - wsp-data:/var/lib/wsp/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  wsp-data: