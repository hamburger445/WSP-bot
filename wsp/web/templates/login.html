<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090d">
  <title>Sign in · WSP Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=5">
</head>
<body class="login-body">
  <div class="lightbar"></div>
  <div class="login-shell">
    <aside class="login-brand">
      <p class="kicker">Lakeville Roleplay</p>
      <p class="login-state">Wisconsin</p>
      <h1>State Patrol</h1>
      <p class="lede">Sign in to continue.</p>
      <div class="login-status">
        <div class="signal {{ 'live' if bot_ready else 'down' }}"></div>
        <span>{{ 'Online' if bot_ready else 'Offline' }}</span>
      </div>
    </aside>
    <section class="login-panel">
      <p class="eyebrow">Command Center</p>
      <h2>Sign in</h2>
      {% if error %}
        <p class="banner">Sign-in failed.</p>
      {% endif %}
      {% if oauth_ready %}
        <a class="gold-btn" href="/auth/discord">Continue with Discord</a>
      {% else %}
        <p class="banner">Sign-in is not configured.</p>
      {% endif %}
    </section>
  </div>
</body>
</html>
